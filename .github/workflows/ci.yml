name: CI

# Vérifie uniquement que le projet build correctement.
# Le déploiement est géré par Dokploy (à chaque tag sur master) : aucun
# push d'image ni accès au serveur ici.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docker (sans push)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
