services:
  web:
    image: ${IMAGE:-primalstore-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: primal-web
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3000"
   
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
